name: Playwright Docker Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  docker-playwright-tests:
    runs-on: ubuntu-latest
    
    steps:
    # Checkout the repository
    - uses: actions/checkout@v4
    
    # Build Docker image
    - name: Build Docker image
      run: docker build -t playwright-tests .
    
    # Run tests inside Docker with test result generation
    - name: Run Playwright tests in Docker
      run: |
        mkdir -p test-results
        docker run --rm \
          -v $(pwd)/test-results:/app/test-results \
          playwright-tests \
          npx playwright test --reporter=html
    
    # Always upload test results, regardless of test outcome
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: |
          test-results/
          playwright-report/
        retention-days: 30

    # Check test results
    - name: Check test results
      if: always()
      run: |
        if [ -f "test-results/report.xml" ]; then
          echo "Test report generated successfully"
          cat test-results/report.xml
        else
          echo "No test report found"
          exit 1
        fi